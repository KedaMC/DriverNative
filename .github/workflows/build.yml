name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "driver/ztsd-1.5.7-12" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Verify native libs
        run: |
          ls -l app/src/main/jniLibs/arm64-v8a/
          test -f app/src/main/jniLibs/arm64-v8a/libzstd-jni_dh-1.5.7-12.so
          test -f app/src/main/jniLibs/arm64-v8a/libsqlitejdbc.so

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ZTSD-zstd-jni-1.5.7-12-dhcompat
          path: build/outputs/apk/release/*.apk
